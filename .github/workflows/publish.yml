name: Publish

# When a package.json changes on main, as a version bump does, runs every
# check CI runs and stages on npm each package whose version isn't
# published yet. Nothing is released until a maintainer runs
# `npm stage approve <stage-id>` with 2FA, core first.
#
# npm trusts this workflow by its file name (publish.yml) and its GitHub
# environment (npm) for @edity/core and @edity/astro, and only to stage: it
# can't publish directly.

on:
  push:
    branches: [main]
    paths: ['packages/*/package.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Every check CI runs, at the commit that gets staged. It runs in
  # Playwright's image, like ci.yml's job, so it downloads no system
  # libraries from Ubuntu's mirror, which once took 13 minutes. The image
  # gets no token and no environment: only the stage job below does.
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The same image as ci.yml's job: keep both on @playwright/test's version
    # in pnpm-lock.yaml, pinned by digest.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The runner's own user, rather than the image's default of root.
      options: --user 1001
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8

      # The image already holds the browsers of its Playwright version, and
      # this downloads matching ones if the lockfile's version differs.
      - name: Install the browsers for the browser tests
        run: mise run browsers
        timeout-minutes: 5

      - name: Lint, check formatting, type-check, test and check the packages
        run: mise run ci

  # Stages only once the checks have passed. It checks out the same commit
  # and builds the packages again on GitHub's own runner, outside the image,
  # so no code from the image runs where npm's token can be requested.
  stage:
    needs: check
    if: github.ref == 'refs/heads/main'
    # npm trusted publishing doesn't support self-hosted runners, such as
    # Blacksmith's.
    runs-on: ubuntu-24.04
    # npm's trusted publisher names this environment: a token from any other
    # job is refused.
    environment: npm
    timeout-minutes: 10
    permissions:
      contents: read
      # Exchanged with npm for a short-lived token, and signs the provenance.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8

      - name: Stage the packages whose version isn't on npm yet
        run: mise run publish:stage
