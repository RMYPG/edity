name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the older run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # GitHub's hosted runner has 4 vCPUs for public repositories, free, so
    # Playwright runs 2 workers. On a 2-vCPU runner it runs 1, and the browser
    # tests alone took over 12 of the 15 minutes.
    runs-on: ubuntu-24.04
    # Playwright's image holds the system libraries the browsers need, so a
    # run no longer downloads them from Ubuntu's mirror. On 2026-11-18 and 19
    # that download, 125 MB at 160 kB/s, took 13 of the 15 minutes. Keep the
    # tag on @playwright/test's version in pnpm-lock.yaml, and pin the digest.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # The runner's own user, as Playwright's CI guide runs it: as root,
      # Chromium runs without its sandbox.
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml, so CI runs the same versions
      # as a local `mise install`.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8

      # The image already holds the browsers of its Playwright version. If the
      # lockfile's version ever differs, this downloads the matching ones,
      # about 30 seconds; the system libraries come from the image either way.
      - name: Install the browsers for the browser tests
        run: mise run browsers
        timeout-minutes: 5

      - name: Lint, check formatting, type-check, test and check the packages
        run: mise run ci

      - name: Upload the browser tests' report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: packages/astro/playwright-report/
          retention-days: 7
