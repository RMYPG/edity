packages:
  - packages/*
  # The fixture Site the integration and the Editor are tested against.
  - packages/astro/test/fixture

strictDepBuilds: true

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAge: 4320 # 3 days
# minimumReleaseAgeExclude:
#   - package-with-critical-hotfix@1.2.3

trustPolicy: no-downgrade

peerDependencyRules:
  allowedVersions:
    # It asks for TypeScript 5, and generates the Editor's API types with 6
    # just as well (`mise run api:generate`).
    openapi-typescript>typescript: '6'
